<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentIMP</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #111827;
        --card: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --accent-strong: #2563eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #111827 60%, #0f172a);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .container {
        width: min(92vw, 760px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
        padding: 48px 32px;
        text-align: center;
      }

      .badge {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(96, 165, 250, 0.15);
        border: 1px solid rgba(96, 165, 250, 0.4);
        color: var(--accent);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-weight: 700;
      }

      h1 {
        margin: 20px 0 12px;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.1;
      }

      p {
        margin: 0 auto;
        max-width: 560px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .actions {
        margin-top: 28px;
        display: flex;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      a.button {
        display: inline-block;
        text-decoration: none;
        padding: 12px 22px;
        border-radius: 10px;
        font-weight: 700;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      a.button:hover {
        transform: translateY(-1px);
      }

      .button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: white;
      }

      .button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.35);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="badge">AgentIMP</div>
      <h1>Build smarter. Move faster.</h1>
      <p>
        A minimal landing page for AgentIMP, designed to present your product clearly and keep the first impression strong.
      </p>
      <div class="actions">
        <a class="button primary" href="#">Get Started</a>
        <a class="button secondary" href="#">Learn More</a>
      </div>
    </main>
  </body>
</html>
